name: Publish AI News Reel

on:
  workflow_run:
    workflows: ["Generate AI News Reel"]
    types: [completed]
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "Generate workflow run ID (leave empty to use latest successful run)"
        required: false
        type: string
      publish_to:
        description: "Platforms to publish to"
        required: true
        default: both
        type: choice
        options: [both, youtube, instagram]
      approval:
        description: "Type PUBLISH to confirm public publishing"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-ai-news-reel-${{ github.event.workflow_run.id || inputs.artifact_run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.approval == 'PUBLISH') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install publishing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download generated reel artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-news-reel-${{ github.event.workflow_run.run_number || inputs.artifact_run_id }}
          path: output
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || inputs.artifact_run_id || github.run_id }}

      - name: Validate generated files and build metadata
        run: |
          python -m app.publish --prepare
        env:
          OUTPUT_DIR: output
          PUBLISH_TO: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to || 'both' }}

      - name: Configure AWS credentials
        if: ${{ env.PUBLISH_TO != 'youtube' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Publish to YouTube Shorts
        if: ${{ env.PUBLISH_TO == 'both' || env.PUBLISH_TO == 'youtube' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'private' }}
          YOUTUBE_CATEGORY_ID: ${{ vars.YOUTUBE_CATEGORY_ID || '28' }}
        run: python -m app.publish --youtube

      - name: Upload video to temporary public S3 object
        if: ${{ env.PUBLISH_TO == 'both' || env.PUBLISH_TO == 'instagram' }}
        id: video-host
        env:
          S3_BUCKET: ${{ secrets.PUBLISH_S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: python -m app.publish --host-video

      - name: Publish Instagram Reel
        if: ${{ env.PUBLISH_TO == 'both' || env.PUBLISH_TO == 'instagram' }}
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION || 'vXX.X' }}
          S3_BUCKET: ${{ secrets.PUBLISH_S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: python -m app.publish --instagram

      - name: Delete temporary S3 video
        if: ${{ always() && (env.PUBLISH_TO == 'both' || env.PUBLISH_TO == 'instagram') }}
        env:
          S3_BUCKET: ${{ secrets.PUBLISH_S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: python -m app.publish --cleanup || true

      - name: Upload publishing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publishing-report-${{ github.run_number }}
          path: output/publishing-report.json
          if-no-files-found: ignore
          retention-days: 30
