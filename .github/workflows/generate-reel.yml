name: Generate AI News Reel

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      language:
        description: "Language for narration and on-screen text"
        required: true
        type: choice
        default: "Telugu"
        options:
          - "Telugu"
          - "English"
  schedule:
    # 09:00 India Standard Time (03:30 UTC)
    - cron: "30 3 * * *"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke tests
        run: python -m pytest -q

      - name: Generate the reel
        run: python -m app.main
        env:
          OUTPUT_DIR: output
          LANGUAGE: ${{ inputs.language == 'English' && 'en' || 'te' }}
          TTS_RATE: "+12%"
          USE_OLLAMA: "false"

      - name: Upload generated video and source files
        uses: actions/upload-artifact@v4
        with:
          name: ai-news-reel-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.json
            output/*-voice.mp3
            output/*-source.txt
          if-no-files-found: error
          retention-days: 14
