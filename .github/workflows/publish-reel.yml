name: Publish AI News Reel

on:
  workflow_run:
    workflows: ["Generate AI News Reel"]
    types: [completed]
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "ID of the successful Generate AI News Reel run to publish"
        required: true
        type: string
      publish_to:
        description: "Platforms to publish to"
        required: true
        default: both
        type: choice
        options: [both, youtube, instagram]
      approval:
        description: "Type PUBLISH to confirm publishing"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-ai-news-reel-${{ github.event.workflow_run.id || inputs.artifact_run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.approval == 'PUBLISH') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OUTPUT_DIR: output
      PUBLISH_TO: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to || 'both' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install publishing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve manual generation run number
        id: source-run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GENERATION_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GENERATION_RUN_ID")"
          run_number="$(python -c 'import json,sys; print(json.load(sys.stdin)["run_number"])' <<< "$run_json")"
          conclusion="$(python -c 'import json,sys; print(json.load(sys.stdin)["conclusion"] or "")' <<< "$run_json")"
          workflow_name="$(python -c 'import json,sys; print(json.load(sys.stdin)["name"])' <<< "$run_json")"
          if [ "$workflow_name" != "Generate AI News Reel" ] || [ "$conclusion" != "success" ]; then
            echo "Run ID must identify a successful Generate AI News Reel run." >&2
            exit 1
          fi
          echo "run_number=$run_number" >> "$GITHUB_OUTPUT"

      - name: Download generated reel artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-news-reel-${{ github.event.workflow_run.run_number || steps.source-run.outputs.run_number }}
          path: output
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || inputs.artifact_run_id }}

      - name: Validate generated files and build metadata
        run: python -m app.publish --prepare

      - name: Publish to YouTube Shorts
        if: ${{ env.PUBLISH_TO == 'both' || env.PUBLISH_TO == 'youtube' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'private' }}
          YOUTUBE_CATEGORY_ID: ${{ vars.YOUTUBE_CATEGORY_ID || '28' }}
        run: python -m app.publish --youtube

      - name: Publish Instagram Reel using direct resumable upload
        if: ${{ env.PUBLISH_TO == 'both' || env.PUBLISH_TO == 'instagram' }}
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION || 'vXX.X' }}
        run: python -m app.publish --instagram

      - name: Upload publishing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publishing-report-${{ github.run_number }}
          path: output/publishing-report.json
          if-no-files-found: ignore
          retention-days: 30
